- name: add taps
  community.general.homebrew_tap:
    name:
      - d12frosted/emacs-plus
      - delphinus/sfmono-square
      - asmvik/formulae
      - docker/tap
      - k1low/tap
      - osx-cross/arm
      - osx-cross/avr
      - qmk/qmk

# Homebrew 7 以降はサードパーティ tap を trust しないと読み込まれない
- name: trust taps
  shell: brew trust d12frosted/emacs-plus delphinus/sfmono-square asmvik/formulae docker/tap k1low/tap osx-cross/arm osx-cross/avr qmk/qmk

- name: update homebrew
  community.general.homebrew:
    update_homebrew: true

- name: install homebrew apps
